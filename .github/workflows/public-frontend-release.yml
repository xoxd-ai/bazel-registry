name: Public frontend release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release plan to prepare
        type: choice
        options:
          - site-scaffold-public-v0.1.1
          - public-frontend-v0.1.1
          - xoxd-spectrogram-public-v1.0.1
          - xoxd-spectrogram-public-v1.1.0
        default: site-scaffold-public-v0.1.1
      publish:
        description: Publish the audited versioned assets after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs the pinned source repositories' exporters. Foreign code runs here, so
  # this job holds only a read token and hands its output to the verify job as
  # an artifact; it never verifies or publishes anything itself.
  export:
    if: github.repository == 'xoxd-ai/bazel-registry' && github.ref == 'refs/heads/main'
    runs-on: tinyland-nix
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read and validate immutable release source revisions
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          plan="releases/${RELEASE_TAG}/plan.json"
          # Only known source keys, so a plan key cannot shadow a control output.
          jq -e '(.sources | keys) - ["scaffold", "theme", "xoxd", "spectrogram"] == []' "$plan" >/dev/null || { echo 'Plan names an unknown source; refusing.' >&2; exit 1; }
          jq -e '.sources.scaffold != null' "$plan" >/dev/null || { echo 'Plan must pin the scaffold source; refusing.' >&2; exit 1; }
          jq -e '[.registry_commit, .sources[]] | all(type == "string" and test("^[0-9a-f]{40}$"))' "$plan" >/dev/null || { echo 'Plan revisions must be 40-hex commit SHAs; refusing.' >&2; exit 1; }
          jq -e '(.exporter // "scaffold") as $e | ["scaffold", "spectrogram"] | index($e) != null' "$plan" >/dev/null || { echo 'Unknown release exporter; refusing.' >&2; exit 1; }
          jq -e '(.template_only // false) | type == "boolean"' "$plan" >/dev/null || { echo 'template_only must be a boolean; refusing.' >&2; exit 1; }
          {
            jq -r '.sources | to_entries[] | "\(.key)=\(.value)"' "$plan"
            jq -r '"registry=" + .registry_commit' "$plan"
            jq -r '"template_only=" + ((.template_only // false) | tostring)' "$plan"
            jq -r '"exporter=" + (.exporter // "scaffold")' "$plan"
          } >> "$GITHUB_OUTPUT"
      - name: Mint a source-only read token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.TINYLAND_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TINYLAND_REGISTRY_APP_KEY }}
          owner: xoxd-ai
          repositories: |
            site.scaffold
            xoxd-theme
            xoxd-spectrogram
          permission-contents: read
      # fetch-depth 0 brings origin/main, so the pins' ancestry can be checked.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: xoxd-ai/site.scaffold
          ref: ${{ steps.source.outputs.scaffold }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          path: _source/scaffold
      - if: steps.source.outputs.theme != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: xoxd-ai/xoxd-theme
          ref: ${{ steps.source.outputs.theme }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          path: _source/theme
      - if: steps.source.outputs.spectrogram != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: xoxd-ai/xoxd-spectrogram
          ref: ${{ steps.source.outputs.spectrogram }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          path: _source/spectrogram
      - name: Check that the pinned sources are on their main branches
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          SCAFFOLD_REF: ${{ steps.source.outputs.scaffold }}
          THEME_REF: ${{ steps.source.outputs.theme }}
          SPECTROGRAM_REF: ${{ steps.source.outputs.spectrogram }}
        run: |
          # A squash or rebase merge leaves the reviewed pin off main. Publication
          # refuses that; a dry run only warns (older plans predate this check).
          off_main=0
          for pair in "scaffold:$SCAFFOLD_REF" "theme:$THEME_REF" "spectrogram:$SPECTROGRAM_REF"; do
            name="${pair%%:*}"; pin="${pair#*:}"
            [ -n "$pin" ] || continue
            if git -C "_source/$name" merge-base --is-ancestor "$pin" refs/remotes/origin/main; then
              echo "$name pin $pin is on main"
            else
              echo "::warning::$name pin $pin is not an ancestor of its main branch"
              off_main=1
            fi
          done
          if [ "$off_main" = 1 ] && [ "$PUBLISH_REQUESTED" = true ]; then
            echo 'Refusing publication from a source pin that is not on main.' >&2
            exit 1
          fi
      - name: Build deterministic narrowed archives
        env:
          EXPORTER: ${{ steps.source.outputs.exporter }}
          TEMPLATE_ONLY: ${{ steps.source.outputs.template_only }}
          REGISTRY_COMMIT: ${{ steps.source.outputs.registry }}
          SPECTROGRAM_REF: ${{ steps.source.outputs.spectrogram }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$EXPORTER" in
            scaffold)
              export_args=()
              if [ "$TEMPLATE_ONLY" = true ]; then export_args+=(--template-only); fi
              python3 -I _source/scaffold/scripts/export-public-frontend.py --theme-source _source/theme --output public-assets --registry-commit "$REGISTRY_COMMIT" "${export_args[@]}"
              ;;
            spectrogram)
              # The module's own exporter reads the committed tree at the pinned revision.
              python3 -I _source/spectrogram/scripts/export-public.py --source _source/spectrogram --ref "$SPECTROGRAM_REF" --output public-assets --registry-commit "$REGISTRY_COMMIT" --tag "$RELEASE_TAG"
              ;;
            *) echo 'Unknown release exporter; refusing.' >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-assets
          path: public-assets/
          if-no-files-found: error
          retention-days: 7

  # Verifies and publishes from a fresh registry checkout that no exporter has
  # touched. The committed plan pins every byte, so the artifact is admitted
  # only if it matches the plan exactly.
  release:
    needs: export
    if: github.repository == 'xoxd-ai/bazel-registry' && github.ref == 'refs/heads/main'
    runs-on: tinyland-nix
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the plan's registry commit is on main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          registry_commit="$(jq -r '.registry_commit' "releases/${RELEASE_TAG}/plan.json")"
          [[ "$registry_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'registry_commit must be a 40-hex SHA; refusing.' >&2; exit 1; }
          if git merge-base --is-ancestor "$registry_commit" "$GITHUB_SHA"; then
            echo "registry_commit $registry_commit is an ancestor of $GITHUB_SHA"
          elif [ "$PUBLISH_REQUESTED" = true ]; then
            echo "Refusing publication: registry_commit $registry_commit is not on main." >&2
            exit 1
          else
            echo "::warning::registry_commit $registry_commit is not an ancestor of $GITHUB_SHA"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-assets
          path: public-assets
      - name: Verify the exported archives against the committed plan
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 -I scripts/verify-public-frontend.py --artifacts public-assets --plan "releases/${RELEASE_TAG}/plan.json"
          python3 -I scripts/test-verify-public-frontend.py --artifacts public-assets --plan "releases/${RELEASE_TAG}/plan.json"
          python3 -I scripts/test-release-publication-admission.py
      - name: Summarize the audited asset set
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          {
            echo '### Verified public frontend assets'
            echo
            echo "Publication requested: $PUBLISH_REQUESTED"
            echo
            echo '```json'
            cat public-assets/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat public-assets/SHA256SUMS
      - name: Verify the exact release bytes again
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -I scripts/verify-public-frontend.py --artifacts public-assets --plan "releases/${RELEASE_TAG}/plan.json"
      - name: Read the publication toolchain pin
        if: inputs.publish
        id: toolchain
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scaffold="$(jq -r '.sources.scaffold' "releases/${RELEASE_TAG}/plan.json")"
          [[ "$scaffold" =~ ^[0-9a-f]{40}$ ]] || { echo 'Scaffold pin must be a 40-hex SHA; refusing.' >&2; exit 1; }
          echo "scaffold=$scaffold" >> "$GITHUB_OUTPUT"
      - name: Mint a scaffold-only read token
        if: inputs.publish
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.TINYLAND_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TINYLAND_REGISTRY_APP_KEY }}
          owner: xoxd-ai
          repositories: |
            site.scaffold
          permission-contents: read
      # Only the template's flake inputs are read (for gh's nixpkgs pin); no
      # scaffold code runs in this job.
      - if: inputs.publish
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: xoxd-ai/site.scaffold
          ref: ${{ steps.toolchain.outputs.scaffold }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: _source/scaffold
      - name: Publish a new immutable asset set
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          nix shell --no-update-lock-file --inputs-from ./_source/scaffold/public/template nixpkgs#gh --command bash -euo pipefail <<'PUBLISH'
          gh --version
          if ! release_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"; then
            echo 'Unable to verify existing releases; refusing publication.' >&2
            exit 1
          fi
          if printf '%s\n' "$release_tags" | grep -Fx -- "$RELEASE_TAG" >/dev/null; then
            echo 'Refusing to replace an existing frontend release.' >&2
            exit 1
          fi
          # gh release create reuses an existing tag and ignores --target, so a tag
          # pushed ahead of the dispatch would pin the release to an arbitrary commit.
          if ! tag_refs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" --jq '.[].ref')"; then
            echo 'Unable to verify existing tags; refusing publication.' >&2
            exit 1
          fi
          if printf '%s\n' "$tag_refs" | grep -Fx -- "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo 'Refusing to publish onto a tag that already exists.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" public-assets/*.tar.gz public-assets/SHA256SUMS public-assets/manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "releases/${RELEASE_TAG}/NOTES.md"
          PUBLISH
