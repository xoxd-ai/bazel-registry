name: Validate registry

# GloriousFlywheel runs this repository's checks: the validate and
# immutability-gate rows of .github/lanes.json run for every pushed head on
# GF's own scheduler, as check runs of the gf-xoxd-ai App (TIN-8469). This
# workflow keeps only the one job GF cannot run yet. The private-consumer
# smokes need the registry-reader App's private key, which only Actions holds,
# to mint a token for the private source archives. A GF worker has no network,
# and GF's source preparation fetches public archives only.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Authenticate main code after a push or an explicit main-ref dispatch, and a
  # pull request whose head branch lives in this repository. Its author already
  # has write access here. A fork PR never reaches this job, so it never sees
  # the App secrets. Dependabot PRs get no Actions secrets, so they skip it too.
  # It runs on same-repository PRs since TIN-8910. The I-24 fifteenth interview
  # made it a required check. GF does not post it: this repository is public,
  # and GF builds private source only for a private repository (TIN-8474
  # 79e7cc54, D1).
  trusted-private-consumers:
    if: >-
      github.repository == 'xoxd-ai/bazel-registry' &&
      (
        (
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The touched-module step diffs this commit against its base, so it
          # needs the history. The whole registry history is about a megabyte.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mint Tinyland registry source token
        id: tinyland-registry-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.TINYLAND_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TINYLAND_REGISTRY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            scheduling-bridge
            scheduling-kit
            tempo-store
            tinyland-file-logger
            tinyland-publishing-hooks
            tinyland-scheduled-publishing
            tinyland-schemas
            tinyland-server-config
            tinyland-server-utils
            tinyland-tracing-middleware
            tinyland-business-pg
          permission-contents: read
      - name: Verify private source token scope
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
        run: |-
          node --input-type=module <<'NODE'
          const token = process.env.TINYLAND_REGISTRY_GITHUB_TOKEN;
          if (!token) throw new Error('registry source token is missing');

          const api = await fetch('https://api.github.com/repos/${{ github.repository_owner }}/scheduling-bridge', {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
            },
          });
          if (!api.ok) throw new Error(`registry source metadata read returned ${api.status}`);

          const archive = await fetch(
            'https://api.github.com/repos/${{ github.repository_owner }}/scheduling-bridge/tarball/v0.7.1',
            {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
              },
              redirect: 'manual',
            },
          );
          if (![301, 302, 303, 307, 308].includes(archive.status)) {
            throw new Error(`API tarball returned ${archive.status}; expected an authenticated redirect`);
          }
          console.log('Private scheduling-bridge metadata and API tarball redirect are readable.');
          NODE
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build isolated scheduling-kit consumer
        run: npm run smoke:scheduling-kit-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Build isolated tempo-store consumer
        run: npm run smoke:tempo-store-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Build isolated scheduling-bridge consumer
        run: npm run smoke:scheduling-bridge-only
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      # caldav-client is public, so this consumer runs without the token: it
      # proves the public archive path for the newest listed version.
      - name: Build isolated caldav-client consumer
        run: npm run smoke:caldav-client-only
      # The newest listed version of every module this change touched, each in
      # its own consumer (TIN-8910). A pull request diffs its merge commit
      # against the base tip, the first parent. A push diffs against the
      # commit main held before it.
      - name: Build the newest listed version of each touched module
        run: npm run smoke:touched
        env:
          SMOKE_TOUCHED_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Audit aggregate active-module graph (legacy compatibility)
        continue-on-error: true
        run: npm run smoke:resolve
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
      - name: Audit Stage 1 aggregate consumer targets (legacy compatibility)
        continue-on-error: true
        run: npm run smoke:stage1-consumer
        env:
          TINYLAND_REGISTRY_GITHUB_TOKEN: ${{ steps.tinyland-registry-token.outputs.token }}
